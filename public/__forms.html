<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact form</title>
  </head>
  <body>
    <!-- Static form so Netlify can detect it at deploy time (SPA redirects skip POST /). -->
    <form name="contact" method="POST" action="/__forms.html" data-netlify="true" netlify data-netlify-honeypot="website">
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
      <input type="text" name="website" />
    </form>
  </body>
</html>
